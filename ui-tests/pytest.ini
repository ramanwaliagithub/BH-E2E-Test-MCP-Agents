[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = test_additional_flows.py
markers =
    smoke: smoke tests
    regression: regression tests
    slow: slow tests
addopts =
    -v
    --tb=short
    --strict-markers
    --ignore=tests/test_additional_flows.py
