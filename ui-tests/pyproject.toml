[project]
name = "ui-tests"
version = "0.1.0"
description = "Playwright UI test suite (Sauce Demo)"
requires-python = ">=3.11"
dependencies = [
    "pytest==7.4.3",
    "playwright==1.55.0",
    "pytest-playwright==0.9.0",
    "python-dotenv==1.0.0",
    "pytest-html==4.1.1",
    "pytest-xdist==3.5.0",
    "allure-pytest==2.16.0",
]

[project.optional-dependencies]
agentic = [
    "anthropic>=0.40.0",
    "mcp>=1.2.0",
]

[tool.uv]
package = false
