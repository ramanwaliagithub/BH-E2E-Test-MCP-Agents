name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: API Tests (Node.js)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: api-tests/package-lock.json
    
    - name: Install dependencies
      working-directory: ./api-tests
      run: npm install
    
    - name: Run API tests
      working-directory: ./api-tests
      run: npm test
      env:
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    - name: Upload API test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results
        path: api-tests/coverage/

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-node-api
        path: api-tests/allure-results/
        if-no-files-found: warn

  api-tests-python:
    name: API Tests (Python Requests)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: api-tests-python/requirements.txt

    - name: Install dependencies
      working-directory: ./api-tests-python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run smoke tests
      working-directory: ./api-tests-python
      run: pytest -v --tb=short -n auto -m smoke --alluredir=allure-results
      env:
        REQRES_BASE_URL: https://reqres.in/api
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    - name: Run regression tests
      working-directory: ./api-tests-python
      run: pytest -v --tb=short -n auto -m regression --alluredir=allure-results
      env:
        REQRES_BASE_URL: https://reqres.in/api
        REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    - name: Upload API test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-python-test-results
        path: api-tests-python/

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-python-api
        path: api-tests-python/allure-results/
        if-no-files-found: warn

  ui-tests:
    name: UI Tests (Playwright + Python)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: '0.12.5'
        enable-cache: true
        cache-dependency-glob: 'ui-tests/uv.lock'

    - name: Set up Python
      working-directory: ./ui-tests
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./ui-tests
      run: uv sync --locked

    - name: Install Playwright browsers
      working-directory: ./ui-tests
      run: uv run playwright install chromium --with-deps

    - name: Run smoke tests
      working-directory: ./ui-tests
      run: uv run pytest -v --tb=short -n auto -m smoke --alluredir=allure-results --tracing=retain-on-failure
      env:
        SAUCE_DEMO_USERNAME: ${{ secrets.SAUCE_DEMO_USERNAME || 'standard_user' }}
        SAUCE_DEMO_PASSWORD: ${{ secrets.SAUCE_DEMO_PASSWORD || 'secret_sauce' }}
        SAUCE_DEMO_URL: https://www.saucedemo.com
        HEADLESS: 'true'

    - name: Run regression tests
      working-directory: ./ui-tests
      run: uv run pytest -v --tb=short -n auto -m regression --alluredir=allure-results --tracing=retain-on-failure
      env:
        SAUCE_DEMO_USERNAME: ${{ secrets.SAUCE_DEMO_USERNAME || 'standard_user' }}
        SAUCE_DEMO_PASSWORD: ${{ secrets.SAUCE_DEMO_PASSWORD || 'secret_sauce' }}
        SAUCE_DEMO_URL: https://www.saucedemo.com
        HEADLESS: 'true'

    - name: Upload UI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: ui-tests/

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-ui
        path: ui-tests/allure-results/
        if-no-files-found: warn

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [api-tests, api-tests-python, ui-tests]
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Report results
      env:
        NODE_API_RESULT: ${{ needs.api-tests.result }}
        PYTHON_API_RESULT: ${{ needs.api-tests-python.result }}
        UI_RESULT: ${{ needs.ui-tests.result }}
      run: |
        {
          echo "## Test Results"
          echo ""
          echo "| Suite | Status |"
          echo "|---|---|"
          echo "| API Tests (Node.js) | $NODE_API_RESULT |"
          echo "| API Tests (Python Requests) | $PYTHON_API_RESULT |"
          echo "| UI Tests (Playwright + Python) | $UI_RESULT |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$NODE_API_RESULT" != "success" ] || [ "$PYTHON_API_RESULT" != "success" ] || [ "$UI_RESULT" != "success" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**One or more suites failed.** Check the failing job's logs above for details." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    if: always()
    needs: [api-tests, api-tests-python, ui-tests]

    steps:
    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
        merge-multiple: true

    - name: Set up Java (required by Allure commandline)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Allure commandline
      run: npm install -g allure-commandline@2.43.0

    - name: Generate Allure report
      run: allure generate allure-results -o allure-report --clean

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Add report link to summary
      run: |
        echo "## Allure Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Download the **allure-report** artifact from this run, unzip it, and open index.html (or run 'npx allure open <unzipped-folder>')." >> "$GITHUB_STEP_SUMMARY"
